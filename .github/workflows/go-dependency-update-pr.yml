name: Reusable Go Dependency Update PR

on:
  workflow_call:
    inputs:
      go-version:
        required: false
        type: string
        default: stable
      working-directory:
        required: false
        type: string
        default: .
      branch-name:
        required: false
        type: string
        default: chore/update-go-dependencies

jobs:
  update-pr:
    name: Go dependency update PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: Update Go modules
        run: |
          go get -u ./...
          go mod tidy

      - name: Test updated dependencies
        run: go test ./...

      - name: Create dependency update PR
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: ${{ inputs.branch-name }}
          delete-branch: true
          commit-message: "chore(deps): update Go dependencies"
          title: "chore(deps): update Go dependencies"
          body: |
            ## Summary

            - updates Go module dependencies with `go get -u ./...`
            - runs `go mod tidy`
            - verifies with `go test ./...`

            This PR is generated by the shared dependency update workflow.
          labels: dependencies,maintenance
