name: Reusable Auto Patch Release

on:
  workflow_call:
    inputs:
      tag-prefix:
        required: false
        type: string
        default: v
    secrets:
      AUTO_RELEASE_GITHUB_TOKEN:
        required: false

jobs:
  tag:
    name: Tag next patch release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_RELEASE_GITHUB_TOKEN || github.token }}

      - name: Create next patch tag when needed
        shell: bash
        run: |
          set -euo pipefail

          prefix='${{ inputs.tag-prefix }}'
          git fetch --tags --force

          if git tag --points-at HEAD | grep -Eq "^${prefix}[0-9]+\.[0-9]+\.[0-9]+$"; then
            echo "HEAD already has a release tag. Nothing to do."
            exit 0
          fi

          latest="$(git tag -l "${prefix}[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            echo "No existing semver tag found for prefix ${prefix}. Refusing to invent initial version."
            exit 1
          fi

          if git merge-base --is-ancestor HEAD "$latest"; then
            echo "No commits after latest tag $latest. Nothing to do."
            exit 0
          fi

          version="${latest#"$prefix"}"
          IFS=. read -r major minor patch <<< "$version"
          next="${prefix}${major}.${minor}.$((patch + 1))"

          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "Next tag $next already exists. Nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$next" HEAD
          git push origin "refs/tags/$next"
          echo "Created $next"
