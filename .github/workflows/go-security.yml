name: Reusable Go Security

on:
  workflow_call:
    inputs:
      go-version:
        required: false
        type: string
        default: stable
      working-directory:
        required: false
        type: string
        default: .
      create-issue:
        description: Create or update a security issue when scheduled/manual scans find vulnerabilities.
        required: false
        type: boolean
        default: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck JSON
        id: govulncheck
        continue-on-error: true
        run: |
          govulncheck -json ./... > govulncheck.json

      - name: Upload govulncheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck-report
          path: ${{ inputs.working-directory }}/govulncheck.json
          if-no-files-found: ignore

      - name: Create or update vulnerability issue
        if: ${{ always() && inputs.create-issue && steps.govulncheck.outcome == 'failure' && github.event_name != 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '${{ inputs.working-directory }}/govulncheck.json';
            const title = 'Security: vulnerability found in Go dependencies';
            const marker = '<!-- managed-by: ojarosch/github-actions go-security -->';
            const report = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').slice(0, 50000) : 'No report file found.';
            const body = `${marker}\n\nA scheduled/manual Go vulnerability scan detected at least one issue.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nNext action:\n\n\`\`\`bash\ngo get -u ./...\ngo mod tidy\ngo test ./...\n\`\`\`\n\nRaw govulncheck JSON, truncated if large:\n\n\`\`\`json\n${report}\n\`\`\``;
            const {owner, repo} = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'security', per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && issue.body?.includes(marker));
            if (existing) {
              await github.rest.issues.update({owner, repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({owner, repo, title, body, labels: ['security', 'cve', 'dependencies']});
            }

      - name: Fail on vulnerabilities
        if: ${{ steps.govulncheck.outcome == 'failure' }}
        run: exit 1

  osv-scan:
    name: OSV scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OSV scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1
        with:
          scan-args: --recursive --format sarif --output osv-results.sarif ${{ inputs.working-directory }}
        continue-on-error: true

      - name: Upload OSV SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-results.sarif

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
